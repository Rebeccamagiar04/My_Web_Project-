<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Access | Portico Kakuma</title>
    <meta name="description"
          content="Log in, create an account, or continue as a guest on Portico Kakuma.">

    <link rel="icon" href="logo.png">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --blue-deep: #101d35;
            --blue-dark: #172d4d;
            --blue: #245582;
            --blue-pale: #f4f8fd;
            --accent: #b7d9f5;
            --white: #ffffff;
            --text: #1b2b42;
            --muted: #68778b;
            --border: #dce6f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
            background:
                radial-gradient(ellipse at 15% 15%,
                    rgba(69,119,171,.28), transparent 38%),
                radial-gradient(ellipse at 90% 85%,
                    rgba(102,151,198,.17), transparent 35%),
                linear-gradient(135deg,
                    var(--blue-deep), #1a3455 58%, #203f62);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        .access-container {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 27px;
            color: var(--white);
        }

        .brand img {
            width: 43px;
            height: 43px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 23px;
            font-weight: bold;
        }

        .access-card {
            padding: 38px 32px 30px;
            background: var(--white);
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 18px;
            box-shadow: 0 24px 65px rgba(4,14,30,.3);
            text-align: center;
        }

        .welcome-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: linear-gradient(145deg,#eaf3fc,#d9e9f8);
            color: var(--blue);
            font-size: 26px;
        }

        h1 {
            margin-bottom: 12px;
            color: var(--blue-deep);
            font-size: 29px;
            line-height: 1.3;
        }

        .intro {
            margin: 0 auto 25px;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.8;
        }

        .access-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .access-btn {
            width: 100%;
            min-height: 51px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            padding: 14px 18px;
            border: 1px solid var(--blue);
            border-radius: 9px;
            background: linear-gradient(120deg,#214b75,#2c608e);
            color: var(--white);
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: .2s ease;
        }

        .access-btn:hover {
            background: #183b61;
            transform: translateY(-1px);
        }

        .access-btn.secondary {
            background: var(--white);
            border-color: #cbd9e8;
            color: var(--blue-dark);
        }

        .access-btn.secondary:hover {
            background: var(--blue-pale);
        }

        .access-btn.guest {
            border-color: transparent;
            background: transparent;
            color: #526b85;
        }

        .access-btn.guest:hover {
            background: var(--blue-pale);
            transform: none;
        }

        .access-btn i {
            width: 17px;
            font-size: 15px;
        }

        /* EMAIL AND PASSWORD FORM */

        #accountForm {
            margin-top: 20px;
            text-align: left;
        }

        #accountForm[hidden] {
            display: none;
        }

        .form-title {
            margin-bottom: 16px;
            color: var(--blue-deep);
            font-size: 20px;
            text-align: center;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 600;
        }

        .field-group input {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .field-group input:focus {
            outline: 2px solid #83b8e8;
            border-color: var(--blue);
        }

        .password-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-wrap input {
            flex: 1;
            min-width: 0;
        }

        .password-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 11px;
            white-space: nowrap;
        }

        .password-toggle input {
            width: auto;
            min-height: auto;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .submit-arrow {
            width: 52px;
            min-width: 52px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 9px;
            background: var(--blue);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-arrow:hover {
            background: var(--blue-dark);
        }

        .cancel-btn {
            flex: 1;
            min-height: 48px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--muted);
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        .guest-note {
            margin-top: 23px;
            padding: 14px;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            border: 1px solid #dce8f4;
            border-radius: 10px;
            background: #f3f7fc;
            color: #435a73;
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.75;
            text-align: left;
        }

        .guest-note i {
            margin-top: 3px;
            color: var(--blue);
        }

        .page-note {
            margin-top: 23px;
            color: #d0deed;
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        .page-note span {
            color: var(--accent);
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }

            .access-card {
                padding: 32px 22px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .intro {
                font-size: 13px;
            }

            .password-wrap {
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
<main class="access-container">

    <section class="access-card" aria-labelledby="page-title">

        <div class="welcome-icon" aria-hidden="true">
            <i class="fa-solid fa-door-open"></i>
        </div>

        <h1 id="page-title">Welcome to Portico</h1>

        <p class="intro" id="introText">
            Your next opportunity starts with a single step.
            Choose how you'd like to continue.
        </p>

        <div class="access-options" id="accessOptions">

            <button type="button" id="showLoginBtn" class="access-btn">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                <span>Log Back In</span>
            </button>

            <button type="button" id="showRegisterBtn"
                    class="access-btn secondary">
                <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                <span>Create an Account</span>
            </button>

            <button type="button" id="continueGuestBtn"
                    class="access-btn guest">
                <i class="fa-solid fa-user-clock" aria-hidden="true"></i>
                <span>Continue as Guest</span>
            </button>

        </div>

        <!-- Shared form for login and registration -->
        <form id="accountForm" hidden>
            <h2 class="form-title" id="formTitle">Log Back In</h2>

            <!-- Required by the existing registration JavaScript.
                 Filled from the questionnaire's saved name. -->
            <div class="field-group" id="nameGroup" hidden>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name"
                       autocomplete="name">
            </div>

            <div class="field-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div class="field-group">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input type="password" id="password" name="password"
                           autocomplete="current-password"
                           minlength="6" required>

                    <label class="password-toggle" for="showPassword">
                        <input type="checkbox" id="showPassword">
                        Show
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-btn" id="cancelFormBtn">
                    Back
                </button>

                <button type="submit" class="submit-arrow"
                        id="formSubmitBtn" aria-label="Log in">
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </form>

        <p class="guest-note" id="guestNote">
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            <span>
                Guest access lasts 24 hours. After that, you'll need
                to log in or create an account to continue.
            </span>
        </p>

    </section>



</main>

<script type="module" src="access.js"></script>

</body>
  </html>
